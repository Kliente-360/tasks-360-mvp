<script src="../lib/adapters.js"></script>

<script>
  // Mini test runner. Sem framework — só funções e contagem.
  const _suites = [];
  let _suite = null;
  function describe(name, fn) {
    _suite = { name, cases: [] };
    _suites.push(_suite);
    fn();
    _suite = null;
  }
  function it(name, fn) {
    try { fn(); _suite.cases.push({ name, ok: true }); }
    catch (e) { _suite.cases.push({ name, ok: false, err: e.message || String(e) }); }
  }
  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error((msg ? msg + ' · ' : '') + `esperado ${e}, recebido ${a}`);
  }
  function truthy(v, msg) { if (!v) throw new Error(msg || `valor falsy: ${v}`); }

  // =================== SUITES ===================

  describe('constants', () => {
    it('STATUS valores corretos', () => {
      eq(STATUS.BACKLOG,    'backlog');
      eq(STATUS.CONCLUIDO,  'concluido');
      eq(STATUS.ANDAMENTO,  'andamento');
      eq(STATUS.BLOQUEADO,  'bloqueado');
    });
    it('ROLE valores corretos', () => {
      eq(ROLE.ADMIN, 'admin');
      eq(ROLE.INTERNO, 'interno');
      eq(ROLE.CLIENTE, 'cliente');
    });
    it('SIGNAL valores corretos', () => {
      eq(SIGNAL.VERDE, 'verde');
      eq(SIGNAL.AMARELO, 'amarelo');
      eq(SIGNAL.VERMELHO, 'vermelho');
    });
    it('constants são imutáveis (frozen)', () => {
      let threw = false;
      try { STATUS.BACKLOG = 'x'; } catch (_) { threw = true; }
      // Em strict mode lança; em loose silently ignora. Verificar valor.
      eq(STATUS.BACKLOG, 'backlog', 'STATUS.BACKLOG não pode ser alterado');
    });
  });

  describe('normalizeTag', () => {
    it('lowercase e trim', () => eq(normalizeTag('  Hello  '), 'hello'));
    it('espaços viram hífen', () => eq(normalizeTag('foo bar baz'), 'foo-bar-baz'));
    it('espaços múltiplos colapsam', () => eq(normalizeTag('a   b'), 'a-b'));
    it('limita a 24 chars', () => eq(normalizeTag('a'.repeat(50)).length, 24));
    it('null/undefined → string vazia', () => {
      eq(normalizeTag(null), '');
      eq(normalizeTag(undefined), '');
      eq(normalizeTag(''), '');
    });
  });

  describe('suggest', () => {
    const all = ['frontend', 'backend', 'design', 'auth', 'database'];
    it('vazio retorna tudo (até 12)', () => {
      eq(suggest('', all, []).length, 5);
    });
    it('filtra por startsWith primeiro', () => {
      const r = suggest('a', all, []);
      eq(r[0], 'auth');
    });
    it('exclui já selecionados', () => {
      const r = suggest('', all, ['frontend']);
      truthy(!r.includes('frontend'));
    });
    it('startsWith antes de includes', () => {
      const r = suggest('end', ['frontend', 'endpoint', 'backend'], []);
      eq(r[0], 'endpoint', 'endpoint começa com "end"');
    });
    it('limita a 12', () => {
      const long = Array.from({length: 20}, (_, i) => 'tag' + i);
      eq(suggest('', long, []).length, 12);
    });
  });

  describe('escapeHtml', () => {
    it('escapa < > pra entidades', () => eq(escapeHtml('<img onerror=x>'), '&lt;img onerror=x&gt;'));
    it('escapa & " \'', () => eq(escapeHtml('a & "b" \'c\''), 'a &amp; &quot;b&quot; &#39;c&#39;'));
    it('null/undefined → string vazia', () => {
      eq(escapeHtml(null), '');
      eq(escapeHtml(undefined), '');
    });
    it('texto limpo passa intacto', () => eq(escapeHtml('Bodytech'), 'Bodytech'));
    it('payload de script vira inerte', () => {
      truthy(!escapeHtml('<script>alert(1)</script>').includes('<script>'));
    });
  });

  describe('fmtDate', () => {
    it('formata ISO pra DD/MM/YYYY', () => eq(fmtDate('2026-05-10'), '10/05/2026'));
    it('vazio retorna —', () => eq(fmtDate(''), '—'));
    it('null retorna —', () => eq(fmtDate(null), '—'));
  });
  describe('fmtDateShort', () => {
    it('formata DD/MM', () => eq(fmtDateShort('2026-05-10'), '10/05'));
    it('vazio retorna —', () => eq(fmtDateShort(''), '—'));
  });

  describe('atrasada', () => {
    const today = '2026-05-15';
    it('sem prazo → não atrasada', () => eq(atrasada({}, today), false));
    it('concluída → nunca atrasada', () => {
      eq(atrasada({ prazo: '2026-01-01', status: STATUS.CONCLUIDO }, today), false);
    });
    it('prazo passado e não concluída → atrasada', () => {
      eq(atrasada({ prazo: '2026-05-10', status: STATUS.ANDAMENTO }, today), true);
    });
    it('prazo hoje → não atrasada', () => {
      eq(atrasada({ prazo: today, status: STATUS.ANDAMENTO }, today), false);
    });
    it('prazo futuro → não atrasada', () => {
      eq(atrasada({ prazo: '2026-12-31', status: STATUS.ANDAMENTO }, today), false);
    });
  });

  describe('cargaNivelFromPctCap', () => {
    it('null → sem-cap', () => eq(cargaNivelFromPctCap(null), 'sem-cap'));
    it('150 → sobrecarga (>130)', () => eq(cargaNivelFromPctCap(150), 'sobrecarga'));
    it('120 → pressão (>100, ≤130)', () => eq(cargaNivelFromPctCap(120), 'pressao'));
    it('80 → ok (60-100)', () => eq(cargaNivelFromPctCap(80), 'ok'));
    it('40 → folga (<60)', () => eq(cargaNivelFromPctCap(40), 'folga'));
    it('exatamente 100 → ok (não pressão)', () => eq(cargaNivelFromPctCap(100), 'ok'));
    it('exatamente 60 → ok (não folga)', () => eq(cargaNivelFromPctCap(60), 'ok'));
    it('exatamente 130 → pressão (não sobrecarga)', () => eq(cargaNivelFromPctCap(130), 'pressao'));
  });

  describe('effEsforco', () => {
    it('esforço declarado → retorna ele', () => eq(effEsforco({ esforco: 8 }), 8));
    it('esforço 0 → 4 (default convencional)', () => eq(effEsforco({ esforco: 0 }), 4));
    it('esforço null/undefined → 4', () => {
      eq(effEsforco({}), 4);
      eq(effEsforco({ esforco: null }), 4);
    });
    it('esforço fracionário', () => eq(effEsforco({ esforco: 2.5 }), 2.5));
  });

  describe('effTamanho', () => {
    it('1h → mini', () => eq(effTamanho({ esforco: 1 }), 'mini'));
    it('4h (default) → small', () => eq(effTamanho({}), 'small'));
    it('20h → medio', () => eq(effTamanho({ esforco: 20 }), 'medio'));
    it('40h → grande', () => eq(effTamanho({ esforco: 40 }), 'grande'));
    it('100h → mini_projeto', () => eq(effTamanho({ esforco: 100 }), 'mini_projeto'));
  });

  describe('triageFailures', () => {
    const full = { pessoaId: 'p1', clienteId: 'c1', prazo: '2026-06-01', esforco: 4, subetapa: 'em_desenvolvimento', status: 'andamento' };
    it('task completa em etapa avançada → vazio', () => {
      eq(triageFailures(full), []);
    });
    it('concluída nunca precisa triar', () => {
      eq(triageFailures({ ...full, status: 'concluido', pessoaId: '', clienteId: '' }), []);
    });
    it('sem responsável (backlog) → sinaliza', () => {
      eq(triageFailures({ ...full, subetapa: 'backlog', pessoaId: '' }), ['sem responsável']);
    });
    it('sem cliente em qualquer etapa → sinaliza', () => {
      eq(triageFailures({ ...full, subetapa: 'backlog', clienteId: '' }), ['sem cliente']);
    });
    it('sem prazo em backlog → não sinaliza (rank 0)', () => {
      eq(triageFailures({ ...full, subetapa: 'backlog', prazo: '' }), []);
    });
    it('sem prazo em priorizado (rank 2) → sinaliza', () => {
      eq(triageFailures({ ...full, subetapa: 'priorizado', prazo: '' }), ['sem prazo']);
    });
    it('sem esforço em escopo_definido (rank 3) → não sinaliza ainda', () => {
      eq(triageFailures({ ...full, subetapa: 'escopo_definido', esforco: 0 }), []);
    });
    it('sem esforço em em_desenvolvimento (rank 4) → sinaliza', () => {
      eq(triageFailures({ ...full, subetapa: 'em_desenvolvimento', esforco: 0 }), ['sem esforço']);
    });
    it('múltiplos critérios falhando', () => {
      const out = triageFailures({ ...full, subetapa: 'em_desenvolvimento', pessoaId: '', clienteId: '', prazo: '', esforco: 0 });
      eq(out, ['sem responsável', 'sem cliente', 'sem prazo', 'sem esforço']);
    });
    it('bloqueado não aplica (rank -1)', () => {
      eq(triageFailures({ ...full, subetapa: 'bloqueado', prazo: '', esforco: 0 }), []);
    });
    it('needsTriage true quando alguma falha', () => {
      truthy(needsTriage({ ...full, pessoaId: '' }));
    });
    it('needsTriage false quando completa', () => {
      eq(needsTriage(full), false);
    });
  });

  // =================== ONDA D · bucketing semanal ===================
  // Datas-âncora: segunda 11/mai/2026 é início da W0 nestes testes.
  describe('weekStartMonday', () => {
    it('segunda → mesmo dia', () => eq(weekStartMonday('2026-05-11'), '2026-05-11'));
    it('terça → segunda anterior', () => eq(weekStartMonday('2026-05-12'), '2026-05-11'));
    it('domingo → segunda da semana anterior (não da seguinte)', () => eq(weekStartMonday('2026-05-17'), '2026-05-11'));
    it('sábado → segunda 5 dias antes', () => eq(weekStartMonday('2026-05-16'), '2026-05-11'));
    it('quinta → segunda 3 dias antes', () => eq(weekStartMonday('2026-05-14'), '2026-05-11'));
    it('Date object aceita', () => eq(weekStartMonday(new Date('2026-05-12T00:00:00')), '2026-05-11'));
    it('virada de ano: 1/jan/2027 (sexta) → segunda 28/dez/2026', () => eq(weekStartMonday('2027-01-01'), '2026-12-28'));
  });

  describe('addDays', () => {
    it('+1 dia', () => eq(addDays('2026-05-11', 1), '2026-05-12'));
    it('+7 dias', () => eq(addDays('2026-05-11', 7), '2026-05-18'));
    it('-1 dia', () => eq(addDays('2026-05-11', -1), '2026-05-10'));
    it('atravessa mês (+30d)', () => eq(addDays('2026-05-11', 30), '2026-06-10'));
    it('atravessa ano (+365d em 2026 não-bissexto)', () => eq(addDays('2026-05-11', 365), '2027-05-11'));
  });

  describe('effPrazoForAnalysis', () => {
    it('task com prazo retorna o prazo', () => eq(effPrazoForAnalysis({ prazo: '2026-06-01' }, '2026-05-15'), '2026-06-01'));
    it('task sem prazo cai pra today fornecido', () => eq(effPrazoForAnalysis({ prazo: '' }, '2026-05-15'), '2026-05-15'));
    it('task null cai pra today', () => eq(effPrazoForAnalysis(null, '2026-05-15'), '2026-05-15'));
  });

  describe('taskWeekIndex', () => {
    const today = '2026-05-13';  // quarta · W0 = 11-17/mai
    it('task concluída → null (não entra na análise prospectiva)', () => {
      eq(taskWeekIndex({ status: 'concluido', prazo: '2026-05-13' }, today), null);
    });
    it('atrasada (prazo na semana passada) → -1', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-05-04' }, today), -1);
    });
    it('prazo nesta semana → 0', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-05-15' }, today), 0);
    });
    it('prazo W+1 (próxima segunda) → 1', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-05-18' }, today), 1);
    });
    it('prazo W+2 → 2', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-05-25' }, today), 2);
    });
    it('prazo W+3 → 3', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-06-01' }, today), 3);
    });
    it('prazo W+4 (fora da janela) → null', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-06-08' }, today), null);
    });
    it('prazo distante (julho) → null', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '2026-07-01' }, today), null);
    });
    it('task sem prazo → default semana atual → 0', () => {
      eq(taskWeekIndex({ status: 'andamento', prazo: '' }, today), 0);
    });
    it('atrasada concluída → null (não atrasada)', () => {
      eq(taskWeekIndex({ status: 'concluido', prazo: '2026-05-01' }, today), null);
    });
  });

  describe('bucketTasksByWeek', () => {
    const today = '2026-05-13';
    it('vazio → buckets vazios', () => {
      eq(bucketTasksByWeek([], today), { past: [], w0: [], w1: [], w2: [], w3: [], far: [] });
    });
    it('null/undefined → buckets vazios', () => {
      eq(bucketTasksByWeek(null, today), { past: [], w0: [], w1: [], w2: [], w3: [], far: [] });
    });
    it('1 task em cada bucket', () => {
      const out = bucketTasksByWeek([
        { id: 'a', status: 'andamento', prazo: '2026-05-04' },
        { id: 'b', status: 'andamento', prazo: '2026-05-15' },
        { id: 'c', status: 'andamento', prazo: '2026-05-18' },
        { id: 'd', status: 'andamento', prazo: '2026-05-25' },
        { id: 'e', status: 'andamento', prazo: '2026-06-01' },
        { id: 'f', status: 'andamento', prazo: '2026-07-01' },
      ], today);
      eq(out.past.map(t=>t.id), ['a']);
      eq(out.w0.map(t=>t.id),   ['b']);
      eq(out.w1.map(t=>t.id),   ['c']);
      eq(out.w2.map(t=>t.id),   ['d']);
      eq(out.w3.map(t=>t.id),   ['e']);
      eq(out.far.map(t=>t.id),  ['f']);
    });
    it('concluída fica fora (vai pro far via null index)', () => {
      const out = bucketTasksByWeek([
        { id: 'a', status: 'concluido', prazo: '2026-05-15' },
      ], today);
      eq(out.w0, []);
      eq(out.far.map(t=>t.id), ['a']);
    });
    it('múltiplas tasks no mesmo bucket', () => {
      const out = bucketTasksByWeek([
        { id: 'a', status: 'andamento', prazo: '2026-05-13' },
        { id: 'b', status: 'andamento', prazo: '2026-05-15' },
        { id: 'c', status: 'andamento', prazo: '2026-05-17' },
      ], today);
      eq(out.w0.length, 3);
    });
    it('sem prazo → default semana atual (w0)', () => {
      const out = bucketTasksByWeek([
        { id: 'a', status: 'andamento', prazo: '' },
      ], today);
      eq(out.w0.map(t=>t.id), ['a']);
    });
  });

  describe('sumEffEsforco', () => {
    it('vazio → 0', () => eq(sumEffEsforco([]), 0));
    it('null → 0', () => eq(sumEffEsforco(null), 0));
    it('soma esforços declarados', () => {
      eq(sumEffEsforco([{ esforco: 4 }, { esforco: 8 }, { esforco: 2 }]), 14);
    });
    it('tasks sem esforço usam default 4h (effEsforco)', () => {
      eq(sumEffEsforco([{ esforco: 0 }, { esforco: '' }]), 8);
    });
    it('mistura zerados e declarados (default 4h pra zerados)', () => {
      eq(sumEffEsforco([{ esforco: 10 }, { esforco: 0 }]), 14);
    });
  });

  describe('projetoCapacidadeSemana', () => {
    it('null → null', () => eq(projetoCapacidadeSemana(null), null));
    it('projeto sem orcamentoHoras → null', () => {
      eq(projetoCapacidadeSemana({ tipo: 'sustentacao' }), null);
    });
    it('projeto com orçamento 0 → null', () => {
      eq(projetoCapacidadeSemana({ tipo: 'sustentacao', orcamentoHoras: 0 }), null);
    });
    it('sustentação 100h/mês → 25h/semana (mensal/4)', () => {
      eq(projetoCapacidadeSemana({ tipo: 'sustentacao', orcamentoHoras: 100 }), 25);
    });
    it('sustentação 40h/mês → 10h/semana', () => {
      eq(projetoCapacidadeSemana({ tipo: 'sustentacao', orcamentoHoras: 40 }), 10);
    });
    it('projeto fechado (tipo=projeto) → null (escopo total, não semanal)', () => {
      eq(projetoCapacidadeSemana({ tipo: 'projeto', orcamentoHoras: 200 }), null);
    });
    it('discovery → null', () => {
      eq(projetoCapacidadeSemana({ tipo: 'discovery', orcamentoHoras: 50 }), null);
    });
    it('sem tipo → null', () => {
      eq(projetoCapacidadeSemana({ orcamentoHoras: 100 }), null);
    });
    it('string numérica em orçamento → Number conversion funciona', () => {
      eq(projetoCapacidadeSemana({ tipo: 'sustentacao', orcamentoHoras: '80' }), 20);
    });
  });

  // =================== ADAPTERS · JS <-> DB ===================
  describe('F (tipos de campo)', () => {
    it('string: null/undefined → ""', () => {
      eq(F.string.from(null), '');
      eq(F.string.from(undefined), '');
      eq(F.string.from('x'), 'x');
    });
    it('fkNull: from "" pra valor, to null pra vazio', () => {
      eq(F.fkNull.from(null), '');
      eq(F.fkNull.from('c1'), 'c1');
      eq(F.fkNull.to(''), null);
      eq(F.fkNull.to('c1'), 'c1');
    });
    it('num: coerção e fallback 0', () => {
      eq(F.num.from('8'), 8);
      eq(F.num.from(null), 0);
      eq(F.num.from('abc'), 0);
    });
    it('numNull: preserva null, converte resto', () => {
      eq(F.numNull.from(null), null);
      eq(F.numNull.from('5'), 5);
      eq(F.numNull.to(''), null);
      eq(F.numNull.to('3'), 3);
    });
    it('boolTrue: só false vira false (default true)', () => {
      eq(F.boolTrue.from(undefined), true);
      eq(F.boolTrue.from(false), false);
      eq(F.boolTrue.from(true), true);
    });
    it('boolFalse: só true vira true (default false)', () => {
      eq(F.boolFalse.from(undefined), false);
      eq(F.boolFalse.from(true), true);
      eq(F.boolFalse.from(false), false);
    });
    it('arr: não-array → []', () => {
      eq(F.arr.from(null), []);
      eq(F.arr.from(['a']), ['a']);
      eq(F.arr.from('x'), []);
    });
    it('date: ISO → timestamp ms; vazio → 0', () => {
      eq(F.date.from(''), 0);
      eq(F.date.from(null), 0);
      truthy(F.date.from('2026-05-15T00:00:00Z') > 0);
    });
  });

  describe('taskFromDb', () => {
    const row = {
      id: 't1', titulo: 'Tarefa', cliente_id: 'c1', projeto_id: null,
      pessoa_id: 'p1', prioridade: 'P1', esforco: '8', complexidade: 'alta',
      prazo: '2026-06-01', status: 'andamento', subetapa: 'em_revisao',
      tags: ['frontend'], status_em: '2026-05-10T12:00:00Z',
      criado_por_ia: true, arquivado_em: null, visivel_cliente: false,
    };
    it('mapeia snake_case → camelCase', () => {
      const t = taskFromDb(row);
      eq(t.id, 't1');
      eq(t.clienteId, 'c1');
      eq(t.pessoaId, 'p1');
      eq(t.subetapa, 'em_revisao');
    });
    it('esforco string → número', () => eq(taskFromDb(row).esforco, 8));
    it('projeto_id null → "" (fkNull)', () => eq(taskFromDb(row).projetoId, ''));
    it('status_em ISO → timestamp ms', () => truthy(taskFromDb(row).statusEm > 0));
    it('criado_por_ia true → criadoPorIa true', () => eq(taskFromDb(row).criadoPorIa, true));
    it('criado_por_ia ausente → false (boolFalse default)', () => {
      eq(taskFromDb({ id: 'x', titulo: 'y' }).criadoPorIa, false);
    });
    it('visivel_cliente false → visivelCliente false', () => eq(taskFromDb(row).visivelCliente, false));
    it('descricao ausente → undefined (lazy load semantic)', () => {
      eq(taskFromDb(row).descricao, undefined);
    });
    it('descricao presente → string', () => {
      eq(taskFromDb({ id: 'x', descricao: 'abc' }).descricao, 'abc');
    });
    it('tags ausente → [] (arr default)', () => {
      eq(taskFromDb({ id: 'x' }).tags, []);
    });
  });

  describe('taskToDb', () => {
    it('campos readonly (id, *_em, ordem, reopen) não vão no payload', () => {
      const out = taskToDb({ id: 't1', titulo: 'x', statusEm: 123, criadoEm: 456, ordem: 2, reopenCount: 1 });
      eq(out.id, undefined);
      eq(out.status_em, undefined);
      eq(out.criado_em, undefined);
      eq(out.ordem, undefined);
      eq(out.reopen_count, undefined);
    });
    it('descricao undefined → não toca a coluna (lazy)', () => {
      const out = taskToDb({ titulo: 'x' });
      eq('descricao' in out, false);
    });
    it('descricao definida → vai no payload', () => {
      eq(taskToDb({ titulo: 'x', descricao: 'abc' }).descricao, 'abc');
    });
    it('clienteId "" → cliente_id null (fkNull)', () => {
      eq(taskToDb({ titulo: 'x', clienteId: '' }).cliente_id, null);
    });
    it('criadoPorIa → criado_por_ia', () => {
      eq(taskToDb({ titulo: 'x', criadoPorIa: true }).criado_por_ia, true);
    });
    it('auto-classifica external_source quando há externalId sem source', () => {
      eq(taskToDb({ titulo: 'x', externalId: 'SF1' }).external_source, 'salesforce');
    });
    it('externalSource explícito é preservado', () => {
      eq(taskToDb({ titulo: 'x', externalId: 'SF1', externalSource: 'asana' }).external_source, 'asana');
    });
  });

  describe('clienteFromDb', () => {
    it('dominios array preservado', () => {
      eq(clienteFromDb({ id: 'c1', nome: 'Body', dominios: ['body.com'] }).dominios, ['body.com']);
    });
    it('dominios null → [] (arr)', () => {
      eq(clienteFromDb({ id: 'c1', nome: 'Body', dominios: null }).dominios, []);
    });
    it('eh_interno → ehInterno (boolFalse)', () => {
      eq(clienteFromDb({ id: 'c1', nome: 'X', eh_interno: true }).ehInterno, true);
      eq(clienteFromDb({ id: 'c1', nome: 'X' }).ehInterno, false);
    });
    it('arquivado_em vazio → null', () => {
      eq(clienteFromDb({ id: 'c1', nome: 'X', arquivado_em: null }).arquivadoEm, null);
    });
  });

  describe('makeBlank(TASK_FIELDS)', () => {
    const blank = makeBlank(TASK_FIELDS);
    it('defaults convencionais aplicados', () => {
      eq(blank.prioridade, 'P2');
      eq(blank.esforco, 4);
      eq(blank.complexidade, 'media');
      eq(blank.status, 'backlog');
      eq(blank.subetapa, 'backlog');
    });
    it('tags é array novo (não compartilhado)', () => {
      const a = makeBlank(TASK_FIELDS), b = makeBlank(TASK_FIELDS);
      a.tags.push('x');
      eq(b.tags, [], 'arrays de blanks distintos não compartilham referência');
    });
    it('criadoPorIa default false', () => eq(blank.criadoPorIa, false));
    it('arquivadoEm default null', () => eq(blank.arquivadoEm, null));
    it('overrides aplicados', () => {
      eq(makeBlank(TASK_FIELDS, { titulo: 'Novo' }).titulo, 'Novo');
    });
  });

  // =================== MUTAÇÕES DE TASK (core-data helpers) ===================
  // Os helpers só tocam this.tasks / this._dataRev / this._touchTasks.
  // Montamos um contexto mínimo e chamamos via .call para testá-los puros.
  describe('mutações de task', () => {
    const cd = window.makeCoreDataView();
    const MUT = ['_touchTasks','_patchTask','_replaceTask','_upsertTask','_patchTasks','_removeTask','_removeTasks','_setAllTasks'];
    function ctx(tasks) {
      const c = { tasks: tasks || [], _dataRev: 0 };
      for (const m of MUT) c[m] = cd[m];
      return c;
    }
    it('_patchTask aplica delta e bumpa _dataRev', () => {
      const c = ctx([{ id: 'a', status: 'backlog' }, { id: 'b', status: 'backlog' }]);
      const prev = c._patchTask('a', { status: 'andamento' });
      eq(prev.status, 'backlog', 'retorna task anterior');
      eq(c.tasks[0].status, 'andamento');
      eq(c.tasks[1].status, 'backlog', 'outras intocadas');
      eq(c._dataRev, 1);
    });
    it('_patchTask id inexistente → null, sem bump', () => {
      const c = ctx([{ id: 'a' }]);
      eq(c._patchTask('zzz', { x: 1 }), null);
      eq(c._dataRev, 0);
    });
    it('_replaceTask troca o objeto inteiro', () => {
      const c = ctx([{ id: 'a', status: 'backlog' }]);
      c._replaceTask('a', { id: 'a', status: 'concluido', novo: true });
      eq(c.tasks[0].novo, true);
      eq(c._dataRev, 1);
    });
    it('_upsertTask insere nova no topo', () => {
      const c = ctx([{ id: 'a' }]);
      c._upsertTask({ id: 'b' });
      eq(c.tasks.map(t => t.id), ['b', 'a']);
    });
    it('_upsertTask substitui existente', () => {
      const c = ctx([{ id: 'a', v: 1 }]);
      c._upsertTask({ id: 'a', v: 2 });
      eq(c.tasks.length, 1);
      eq(c.tasks[0].v, 2);
    });
    it('_patchTasks aplica delta a vários ids', () => {
      const c = ctx([{ id: 'a', p: 'P2' }, { id: 'b', p: 'P2' }, { id: 'c', p: 'P2' }]);
      c._patchTasks(['a', 'c'], { p: 'P0' });
      eq(c.tasks.map(t => t.p), ['P0', 'P2', 'P0']);
      eq(c._dataRev, 1);
    });
    it('_patchTasks aceita Set', () => {
      const c = ctx([{ id: 'a', p: 1 }, { id: 'b', p: 1 }]);
      c._patchTasks(new Set(['b']), { p: 9 });
      eq(c.tasks.map(t => t.p), [1, 9]);
    });
    it('_removeTask remove e retorna a task', () => {
      const c = ctx([{ id: 'a' }, { id: 'b' }]);
      const removed = c._removeTask('a');
      eq(removed.id, 'a');
      eq(c.tasks.map(t => t.id), ['b']);
      eq(c._dataRev, 1);
    });
    it('_removeTask id inexistente → null sem bump', () => {
      const c = ctx([{ id: 'a' }]);
      eq(c._removeTask('zzz'), null);
      eq(c._dataRev, 0);
    });
    it('_removeTasks remove vários', () => {
      const c = ctx([{ id: 'a' }, { id: 'b' }, { id: 'c' }]);
      c._removeTasks(['a', 'c']);
      eq(c.tasks.map(t => t.id), ['b']);
    });
    it('_setAllTasks substitui o array inteiro', () => {
      const c = ctx([{ id: 'a' }]);
      c._setAllTasks([{ id: 'x' }, { id: 'y' }]);
      eq(c.tasks.map(t => t.id), ['x', 'y']);
      eq(c._dataRev, 1);
    });
    it('_setAllTasks com não-array → []', () => {
      const c = ctx([{ id: 'a' }]);
      c._setAllTasks(null);
      eq(c.tasks, []);
    });
    it('patch→revert restaura estado e re-invalida', () => {
      const c = ctx([{ id: 'a', status: 'backlog' }]);
      const prev = c._patchTask('a', { status: 'andamento' });
      c._replaceTask('a', prev);
      eq(c.tasks[0].status, 'backlog');
      eq(c._dataRev, 2, 'patch + revert = 2 invalidações');
    });
  });

  // =================== RENDER ===================
  const results = document.getElementById('results');
  let pass = 0, fail = 0;
  for (const s of _suites) {
    const d = document.createElement('div'); d.className = 'suite';
    const h = document.createElement('div'); h.className = 'suite-title'; h.textContent = s.name; d.appendChild(h);
    for (const c of s.cases) {
      const r = document.createElement('div'); r.className = 'case ' + (c.ok ? 'pass' : 'fail');
      const n = document.createElement('span'); n.className = 'name'; n.textContent = c.name; r.appendChild(n);
      if (!c.ok) {
        const e = document.createElement('span'); e.className = 'err'; e.textContent = c.err; r.appendChild(e);
      }
      d.appendChild(r);
      c.ok ? pass++ : fail++;
    }
    results.appendChild(d);
  }
  const sum = document.getElementById('summary');
  sum.className = 'summary ' + (fail === 0 ? 'pass' : 'fail');
  sum.textContent = fail === 0
    ? `✓ ${pass} testes passando`
    : `✗ ${fail} falhando · ${pass} passando`;
</script>
